<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CSP 兜底：主进程通过 onHeadersReceived 注入更完整的策略，
       这里作为 file:// 加载时的次级防线（Electron 对 meta CSP 支持不完全，但无害）。
       生产构建后 CSP 由主进程覆盖；此处仅供开发/降级场景参考。 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>矿山智工 - 工程机械运维AI工作台</title>
  <!-- 标签页图标：与 exe / 侧栏标识同一份造型（见 components/BrandMark.vue 注释） -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- 首帧主题（见 public/theme-init.js 注释：CSP 下唯一允许的同步脚本，防深色用户闪白） -->
  <script src="/theme-init.js"></script>
  <style>
    /* 启动闪屏：Vue 挂载前（initStore 播种 + 导入手册，首启可达数秒）由它占位，
       挂载时被 Vue 整体替换。纯 HTML/CSS、零 JS 依赖；深浅色跟随 theme-init.js 设好的 data-theme。 */
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #f4f6fa; color: #2c3e50;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    html[data-theme="dark"] #boot-splash { background: #0f1729; color: #dbe4f3; }
    #boot-splash .boot-logo {
      width: 64px; height: 64px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1f5eff, #3f8cff);
      color: #fff; font-size: 30px; font-weight: 700;
      box-shadow: 0 8px 24px rgba(31, 94, 255, .28);
    }
    #boot-splash .boot-name { font-size: 18px; font-weight: 600; letter-spacing: 1px; }
    #boot-splash .boot-bar {
      width: 180px; height: 3px; border-radius: 2px; overflow: hidden;
      background: rgba(128, 140, 160, .25);
    }
    #boot-splash .boot-bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 2px;
      background: #2f6bff; animation: boot-slide 1.1s ease-in-out infinite;
    }
    @keyframes boot-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    #boot-splash .boot-step { font-size: 13px; opacity: .72; min-height: 1.4em; }
  </style>
</head>
<body>
  <div id="app">
    <div id="boot-splash">
      <div class="boot-logo">矿</div>
      <div class="boot-name">矿山智工</div>
      <div class="boot-bar"></div>
      <div class="boot-step" id="boot-splash-text">正在启动…</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
